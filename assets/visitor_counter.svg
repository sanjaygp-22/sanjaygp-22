<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 540 180" width="100%" height="180">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050E1A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020810" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Cyan Glow Filters -->
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scan Line Gradient -->
    <linearGradient id="scan-line-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="card-clip">
      <rect width="540" height="180" rx="12"/>
    </clipPath>
  </defs>

  <style>
    @keyframes pulseLine {
      0%, 100% { stroke-dashoffset: 200; opacity: 0.6; }
      50% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes scanSweep {
      0% { transform: translateY(-180px); }
      100% { transform: translateY(360px); }
    }
    @keyframes borderGlow {
      0%, 100% { opacity: 0.5; stroke: #00AACC; }
      50% { opacity: 1; stroke: #00F0FF; }
    }
    @keyframes dotBlink {
      0%, 80%, 100% { opacity: 1; }
      90% { opacity: 0.2; }
    }
    @keyframes textGlow {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }

    .pulse-line { stroke-dasharray: 200; stroke-dashoffset: 200; animation: pulseLine 2.5s ease-in-out infinite; }
    .scan-line { animation: scanSweep 4.5s linear infinite; }
    .border-anim { animation: borderGlow 3s ease-in-out infinite; }
    .dot-anim { animation: dotBlink 2s ease-in-out infinite; }
    .title-anim { animation: textGlow 3s ease-in-out infinite; }
  </style>

  <g clip-path="url(#card-clip)">
    <!-- 1. Card Base -->
    <rect width="540" height="180" rx="12" fill="url(#card-bg)" stroke="#00F0FF" stroke-width="1.5" class="border-anim"/>

    <!-- 2. Header Bar -->
    <rect width="540" height="36" fill="#0A1828" fill-opacity="0.8"/>
    <line x1="0" y1="36" x2="540" y2="36" stroke="#00F0FF" stroke-width="1" opacity="0.4"/>

    <!-- Header Icon & Title -->
    <circle cx="24" cy="18" r="4" fill="#00FF66" class="dot-anim" filter="url(#glow-soft)"/>
    <text x="36" y="22" font-family="monospace" font-size="12" font-weight="bold" fill="#00F0FF" letter-spacing="1.5" class="title-anim">
      🤖 VISITOR COUNTER // TELEMETRY
    </text>

    <!-- Subtitle -->
    <text x="200" y="65" font-family="monospace" font-size="13" fill="#8B949E" text-anchor="middle">
      Thanks for visiting!
    </text>

    <!-- 3. LIVE VISITOR COUNTER BADGE -->
    <g transform="translate(60, 78)">
      <image href="https://komarev.com/ghpvc/?username=sanjaygp-22&amp;color=00F0FF&amp;style=for-the-badge&amp;label=TOTAL+VISITORS" width="280" height="45"/>
    </g>

    <!-- 4. ANIMATED ECG PULSE WAVE GRAPHIC (Right side) -->
    <g transform="translate(425, 60)">
      <path d="M 0 35 L 20 35 L 25 20 L 32 50 L 40 10 L 48 45 L 55 35 L 85 35" fill="none" stroke="#003B5C" stroke-width="2" opacity="0.5"/>
      <path d="M 0 35 L 20 35 L 25 20 L 32 50 L 40 10 L 48 45 L 55 35 L 85 35" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#glow-strong)" class="pulse-line"/>
    </g>

    <!-- Subtext Below Counter -->
    <text x="200" y="152" font-family="monospace" font-size="11" font-weight="bold" fill="#00F0FF" letter-spacing="2" text-anchor="middle" class="title-anim">
      • LIVE PROFILE TELEMETRY •
    </text>

    <!-- 5. Sweeping Scan Line -->
    <rect x="0" y="0" width="540" height="10" fill="url(#scan-line-grad)" class="scan-line"/>

    <!-- 6. Corner Accents -->
    <path d="M 6 18 L 6 6 L 18 6" stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 534 18 L 534 6 L 522 6" stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 6 162 L 6 174 L 18 174" stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 534 162 L 534 174 L 522 174" stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.8"/>
  </g>
</svg>