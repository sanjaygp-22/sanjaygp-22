<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <filter id="avatar-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Glowing Ring -->
  <circle cx="120" cy="120" r="115" fill="url(#avatar-bg)"/>
  <circle cx="120" cy="120" r="114" fill="none" stroke="url(#ring-grad)" stroke-width="3" filter="url(#avatar-glow)"/>
  <circle cx="120" cy="120" r="104" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.6"/>

  <!-- Cyber HUD Reticle Elements -->
  <line x1="120" y1="10" x2="120" y2="30" stroke="#00F0FF" stroke-width="2"/>
  <line x1="120" y1="210" x2="120" y2="230" stroke="#00F0FF" stroke-width="2"/>
  <line x1="10" y1="120" x2="30" y2="120" stroke="#00F0FF" stroke-width="2"/>
  <line x1="210" y1="120" x2="230" y2="120" stroke="#00F0FF" stroke-width="2"/>

  <!-- Anime Mastermind Character Silhouette -->
  <!-- Shoulders & Coat -->
  <path d="M 40 215 C 60 170, 80 155, 120 155 C 160 155, 180 170, 200 215 Z" fill="#0D1626" stroke="#00F0FF" stroke-width="2"/>
  
  <!-- High Collar / Suit Lines -->
  <path d="M 90 165 L 120 195 L 150 165" fill="none" stroke="#7000FF" stroke-width="2.5"/>
  <path d="M 120 195 L 120 220" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Neck -->
  <rect x="108" y="130" width="24" height="30" fill="#162238" rx="4"/>

  <!-- Face Contour -->
  <path d="M 85 100 Q 120 145 155 100 Q 155 75 120 70 Q 85 75 85 100 Z" fill="#0F1B30" stroke="#00F0FF" stroke-width="1.5"/>

  <!-- Anime Spiky Hair -->
  <path d="M 75 95 Q 60 65 90 55 Q 110 35 130 45 Q 155 35 170 60 Q 185 85 165 95 Q 150 70 120 70 Q 90 70 75 95 Z" fill="#091428" stroke="#7000FF" stroke-width="2"/>
  
  <!-- Front Bangs -->
  <path d="M 95 65 Q 110 85 105 100" stroke="#00F0FF" stroke-width="2" fill="none"/>
  <path d="M 120 60 Q 125 85 130 102" stroke="#00F0FF" stroke-width="2" fill="none"/>
  <path d="M 140 65 Q 145 82 148 95" stroke="#7000FF" stroke-width="1.5" fill="none"/>

  <!-- Glowing Cyber Eye HUD (Right Eye) -->
  <circle cx="138" cy="98" r="7" fill="#00F0FF" filter="url(#avatar-glow)"/>
  <circle cx="138" cy="98" r="3" fill="#FFFFFF"/>
  <circle cx="138" cy="98" r="12" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Left Eye Calm Silhouette -->
  <path d="M 98 96 Q 106 92 112 96" stroke="#8B949E" stroke-width="2" fill="none"/>

  <!-- Cyber Glasses / HUD Visor Frame Line -->
  <path d="M 85 92 L 155 92" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Small Mouth line -->
  <path d="M 115 122 L 125 122" stroke="#8B949E" stroke-width="1.5"/>

  <!-- Status Indicator Dot -->
  <circle cx="180" cy="180" r="10" fill="#00FF66" filter="url(#avatar-glow)"/>
  <circle cx="180" cy="180" r="5" fill="#FFFFFF"/>
</svg>
