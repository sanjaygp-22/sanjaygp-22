<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 30" width="100%" height="30">
  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7000FF" stop-opacity="1"/>
      <stop offset="85%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>

    <filter id="div-glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .pulse-node { animation: pulse 2s ease-in-out infinite alternate; }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.1); }
    }
  </style>

  <!-- Horizontal Glow Line -->
  <line x1="50" y1="15" x2="950" y2="15" stroke="url(#divider-grad)" stroke-width="2" filter="url(#div-glow)"/>
  
  <!-- Center Cyber Tech Node -->
  <g transform="translate(500, 15)">
    <!-- Diamond -->
    <polygon points="0,-8 10,0 0,8 -10,0" fill="#0D1117" stroke="#00F0FF" stroke-width="2" filter="url(#div-glow)"/>
    <circle cx="0" cy="0" r="3" fill="#00F0FF" class="pulse-node"/>
  </g>

  <!-- Side Tech Accents -->
  <circle cx="300" cy="15" r="2" fill="#00F0FF"/>
  <circle cx="700" cy="15" r="2" fill="#00F0FF"/>
  <line x1="280" y1="15" x2="290" y2="15" stroke="#7000FF" stroke-width="2"/>
  <line x1="710" y1="15" x2="720" y2="15" stroke="#7000FF" stroke-width="2"/>
</svg>
