<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#091428"/>
    </linearGradient>

    <!-- Neon Cyan / Blue Gradients -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-intense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.12"/>
      <circle cx="40" cy="40" r="1" fill="#00F0FF" fill-opacity="0.3"/>
    </pattern>

    <!-- Binary Code Overlay Pattern -->
    <pattern id="binary-rain" width="100" height="80" patternUnits="userSpaceOnUse">
      <text x="10" y="20" font-family="monospace" font-size="10" fill="#00F0FF" fill-opacity="0.15">01101001</text>
      <text x="10" y="40" font-family="monospace" font-size="10" fill="#00F0FF" fill-opacity="0.08">10110010</text>
      <text x="10" y="60" font-family="monospace" font-size="10" fill="#00F0FF" fill-opacity="0.2">11001011</text>
    </pattern>
  </defs>

  <style>
    .pulse-glow { animation: pulse 3s infinite alternate; }
    .scanline { animation: scan 8s linear infinite; }
    .float-item { animation: float 4s ease-in-out infinite; }
    @keyframes pulse {
      0% { opacity: 0.4; }
      100% { opacity: 0.9; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/>
  <rect width="1200" height="420" fill="url(#cyber-grid)" rx="16"/>
  <rect width="1200" height="420" fill="url(#binary-rain)" rx="16"/>

  <!-- Glowing Corner Borders -->
  <path d="M 20 60 L 20 20 L 60 20" fill="none" stroke="#00F0FF" stroke-width="3" filter="url(#glow-cyan)"/>
  <path d="M 1180 60 L 1180 20 L 1140 20" fill="none" stroke="#00F0FF" stroke-width="3" filter="url(#glow-cyan)"/>
  <path d="M 20 360 L 20 400 L 60 400" fill="none" stroke="#00F0FF" stroke-width="3" filter="url(#glow-cyan)"/>
  <path d="M 1180 360 L 1180 400 L 1140 400" fill="none" stroke="#00F0FF" stroke-width="3" filter="url(#glow-cyan)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="120" r="150" fill="#00F0FF" opacity="0.08" filter="url(#glow-intense)"/>
  <circle cx="1000" cy="300" r="180" fill="#7000FF" opacity="0.1" filter="url(#glow-intense)"/>

  <!-- Left Side: Anime AI Mastermind HUD Silhouette Graphics -->
  <g transform="translate(100, 70)">
    <!-- Tech Circle Rings -->
    <circle cx="110" cy="140" r="100" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="8 6"/>
    <circle cx="110" cy="140" r="115" fill="none" stroke="#7000FF" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="20 10"/>
    <circle cx="110" cy="140" r="85" fill="none" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.6"/>
    
    <!-- HUD Target Reticle -->
    <line x1="10" y1="140" x2="210" y2="140" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1"/>
    <line x1="110" y1="40" x2="110" y2="240" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1"/>

    <!-- Anime Head / Mastermind Silhouette with Glowing Cyber Eye -->
    <path d="M 70 210 Q 75 140 100 110 Q 110 80 130 90 Q 150 100 155 130 Q 160 160 165 210 Z" fill="#091428" stroke="#00F0FF" stroke-width="2" filter="url(#glow-cyan)"/>
    <!-- Anime Hair Tufts Silhouette -->
    <path d="M 85 110 Q 70 85 95 70 Q 115 55 135 65 Q 155 50 165 80 Q 175 100 155 115 Z" fill="#0D1626" stroke="#7000FF" stroke-width="1.5"/>
    <!-- Glowing Eye HUD Lens -->
    <circle cx="120" cy="118" r="6" fill="#00F0FF" filter="url(#glow-intense)"/>
    <circle cx="120" cy="118" r="2" fill="#FFFFFF"/>
    <line x1="126" y1="118" x2="150" y2="118" stroke="#00F0FF" stroke-width="1.5" filter="url(#glow-cyan)"/>
    <text x="155" y="122" font-family="monospace" font-size="10" fill="#00F0FF" font-weight="bold">TARGET_LOCKED</text>
  </g>

  <!-- Right/Center Header Text & System Status -->
  <!-- Top OS Bar Tag -->
  <rect x="360" y="55" width="280" height="28" rx="6" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="1"/>
  <text x="375" y="74" font-family="Consolas, monospace" font-size="12" fill="#00F0FF" font-weight="bold" letter-spacing="2">SYSTEM :: SANJAY_OS v2.6</text>

  <!-- Main Name Title -->
  <text x="360" y="160" font-family="'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="url(#text-grad)" filter="url(#glow-cyan)" letter-spacing="4">SANJAY G P</text>

  <!-- Subtitle with Glowing Cyber Brackets -->
  <text x="360" y="210" font-family="'Segoe UI', Roboto, monospace" font-size="20" font-weight="700" fill="#00F0FF" letter-spacing="3">
    &lt; ARTIFICIAL INTELLIGENCE &amp; DATA SCIENCE /&gt;
  </text>

  <!-- Tags Pill Bar -->
  <g transform="translate(360, 235)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#0D1626" stroke="#00F0FF" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="4" fill="#00F0FF" filter="url(#glow-cyan)"/>
    <text x="28" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#E6EDF3">Machine Learning</text>

    <!-- Tag 2 -->
    <rect x="175" y="0" width="150" height="32" rx="16" fill="#0D1626" stroke="#7000FF" stroke-width="1.5"/>
    <circle cx="191" cy="16" r="4" fill="#7000FF" filter="url(#glow-cyan)"/>
    <text x="203" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#E6EDF3">Deep Learning</text>

    <!-- Tag 3 -->
    <rect x="340" y="0" width="160" height="32" rx="16" fill="#0D1626" stroke="#00F0FF" stroke-width="1.5"/>
    <circle cx="356" cy="16" r="4" fill="#00F0FF" filter="url(#glow-cyan)"/>
    <text x="368" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#E6EDF3">Computer Vision</text>
  </g>

  <!-- Status HUD Card in Banner Top Right -->
  <g transform="translate(900, 50)" class="float-item">
    <rect width="260" height="150" rx="12" fill="#0D1626" fill-opacity="0.8" stroke="#00F0FF" stroke-width="1.5" filter="url(#glow-cyan)"/>
    
    <!-- Card Header -->
    <path d="M 0 0 L 260 0 L 260 30 L 0 30 Z" fill="#00F0FF" fill-opacity="0.15"/>
    <text x="15" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#00F0FF">HUD :: SYSTEM STATUS</text>
    <circle cx="240" cy="15" r="4" fill="#00FF66" filter="url(#glow-cyan)"/>

    <!-- Stats Lines -->
    <text x="15" y="55" font-family="monospace" font-size="11" fill="#8B949E">CORE_STATE:</text>
    <text x="120" y="55" font-family="monospace" font-size="11" fill="#00F0FF" font-weight="bold">ONLINE</text>

    <text x="15" y="78" font-family="monospace" font-size="11" fill="#8B949E">LOCATION:</text>
    <text x="120" y="78" font-family="monospace" font-size="11" fill="#FFFFFF">INDIA 🇮🇳</text>

    <text x="15" y="101" font-family="monospace" font-size="11" fill="#8B949E">PRIMARY_LANG:</text>
    <text x="120" y="101" font-family="monospace" font-size="11" fill="#00F0FF">PYTHON / JAVA</text>

    <text x="15" y="124" font-family="monospace" font-size="11" fill="#8B949E">MISSION:</text>
    <text x="120" y="124" font-family="monospace" font-size="11" fill="#00FF66">SOLVE REAL PROBLEMS</text>
  </g>

  <!-- Mission Quote Box Bottom Center -->
  <g transform="translate(360, 300)">
    <rect width="780" height="75" rx="10" fill="#080D1A" fill-opacity="0.9" stroke="#7000FF" stroke-width="1.5"/>
    <path d="M 0 0 L 10 0 L 0 10 Z" fill="#7000FF"/>
    <text x="20" y="30" font-family="Consolas, monospace" font-size="13" fill="#00F0FF" font-style="italic">
      "Building intelligent software that transforms raw data into real-world impact."
    </text>
    
    <!-- Progress Indicator Bar -->
    <text x="20" y="56" font-family="monospace" font-size="11" fill="#8B949E">SYSTEM EVOLUTION [2026 ROADMAP]:</text>
    <rect x="260" y="46" width="400" height="12" rx="6" fill="#161B22"/>
    <rect x="260" y="46" width="310" height="12" rx="6" fill="url(#neon-cyan)" filter="url(#glow-cyan)"/>
    <text x="670" y="56" font-family="monospace" font-size="11" fill="#00F0FF" font-weight="bold">77.5%</text>
  </g>
</svg>
